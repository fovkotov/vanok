<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Печать</title>
<style>
  body { margin: 0; background: #d7d7d7; overflow: hidden; cursor: pointer; }
  canvas { display: block; }
  #hint {
    position: fixed;
    left: 16px;
    bottom: 14px;
    color: #6a6a6a;
    font: 14px/1.3 Arial, Helvetica, sans-serif;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="hint">клик — поставить печать</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const ENTER = 680;
const DROP = 200;
const PRESS = 110;
const LEAVE = 520;
const CYCLE = ENTER + DROP + PRESS + LEAVE;
const SIZE = 0.5;
const SPIN = Math.PI * 2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7d7d7);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.02, 80);
camera.position.set(3.35, 2.45, 4.05);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.45, -0.15);
controls.enableDamping = true;
controls.enableZoom = true;
controls.minDistance = 1.6;
controls.maxDistance = 28;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-0.35, 7.2, -1.6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.4;
key.shadow.camera.far = 16;
const d = 3.2;
Object.assign(key.shadow.camera, { left: -d, right: d, top: d, bottom: -d });
key.target.position.set(0, 0, 0);
scene.add(key, key.target, new THREE.AmbientLight(0xffffff, 0.45));

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.receiveShadow = true;
ground.position.y = -0.002;
scene.add(ground);

const paper = new THREE.Mesh(
  new THREE.PlaneGeometry(2.3, 1.55),
  new THREE.MeshStandardMaterial({ color: 0xf6f6f4, roughness: 0.92, metalness: 0 })
);
paper.rotation.x = -Math.PI / 2;
paper.position.y = 0.001;
paper.position.z = 0.28;
paper.receiveShadow = true;
scene.add(paper);

const blob = new THREE.Mesh(
  new THREE.CircleGeometry(0.46 * SIZE, 40),
  new THREE.MeshBasicMaterial({ color: 0x2a2a2a, transparent: true, opacity: 0, depthWrite: false })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.004;
scene.add(blob);

const file = new URLSearchParams(location.search).get('file') || 'models/stamp_round.glb';
const gltf = await new GLTFLoader().loadAsync(file);
const model = gltf.scene;
const flat = file.includes('round');
model.traverse((o) => {
  if (!o.isMesh) return;
  o.castShadow = true;
  o.material.flatShading = flat;
  o.material.envMapIntensity = o.name === 'Pad' ? 0.08 : 0.2;
});
model.rotation.order = 'YXZ';

const HOME = { x: -0.15, y: 0.16, z: -1.35 };
const TILT = { x: -0.8, y: -3.6, z: 0.25 };
const land = { x: 0, z: 0.28 };
let playing = false;
let startedAt = 0;

function shadeBlob() {
  blob.position.x = playing ? land.x : model.position.x;
  blob.position.z = playing ? land.z : model.position.z;
  const over = playing && model.position.z > -0.55 && model.position.y < 1.5;
  const k = over ? 1 - Math.min(Math.max(model.position.y, 0) / 0.9, 1) : 0;
  blob.material.opacity = over ? 0.07 + k * 0.2 : 0;
  blob.scale.setScalar(1.22 - k * 0.36);
}

function setScale(x, y, z) {
  model.scale.set(SIZE * x, SIZE * y, SIZE * z);
}

function placeHome() {
  model.position.set(HOME.x, HOME.y, HOME.z);
  model.rotation.set(TILT.x, TILT.y, TILT.z);
  setScale(1, 1, 1);
  shadeBlob();
}

placeHome();
scene.add(model);

const hint = document.getElementById('hint');

function easeInCubic(t) { return t * t * t; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2; }
function lerp(a, b, t) { return a + (b - a) * t; }

function pose(now) {
  shadeBlob();
  if (!playing) return;
  const t = now - startedAt;
  const lx = land.x;
  const lz = land.z;

  if (t < ENTER) {
    const k = easeInOut(t / ENTER);
    const lift = Math.sin(k * Math.PI) * 0.62;
    model.position.set(
      lerp(HOME.x, lx, k),
      lerp(HOME.y, 0.58, k) + lift,
      lerp(HOME.z, lz, k),
    );
    model.rotation.set(
      lerp(TILT.x, 0, k),
      lerp(TILT.y, SPIN, k),
      lerp(TILT.z, 0, k),
    );
    setScale(1, 1, 1);
    return;
  }

  if (t < ENTER + DROP) {
    const k = easeInCubic((t - ENTER) / DROP);
    model.position.set(lx, lerp(0.58, 0, k), lz);
    model.rotation.set(0, 0, 0);
    setScale(1, 1, 1);
    return;
  }

  if (t < ENTER + DROP + PRESS) {
    const s = Math.sin(((t - ENTER - DROP) / PRESS) * Math.PI);
    model.position.set(lx, 0, lz);
    model.rotation.set(0, 0, 0);
    setScale(1 + s * 0.045, 1 - s * 0.09, 1 + s * 0.045);
    return;
  }

  if (t < CYCLE) {
    const k = easeInCubic((t - ENTER - DROP - PRESS) / LEAVE);
    const hop = Math.sin(k * Math.PI) * 0.85;
    model.position.set(
      lerp(lx, HOME.x, k),
      lerp(0, HOME.y, k) + hop,
      lerp(lz, HOME.z, k),
    );
    model.rotation.set(
      lerp(0, 0.7, k),
      lerp(0, SPIN, k),
      lerp(0, -0.35, k),
    );
    setScale(1, 1, 1);
    return;
  }

  placeHome();
  playing = false;
  hint.textContent = 'клик — поставить печать';
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function sheetPoint(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return null;
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(paper, false)[0];
  return hit ? hit.point : null;
}

const pointers = new Set();
let gesture = null;

function onPointerDown(e) {
  pointers.add(e.pointerId);
  if (playing || e.button !== 0 || pointers.size !== 1) {
    gesture = null;
    return;
  }
  gesture = { id: e.pointerId, x: e.clientX, y: e.clientY };
}

function onPointerUp(e) {
  const g = gesture;
  pointers.delete(e.pointerId);
  if (!g || e.pointerId !== g.id) return;
  gesture = null;
  if (playing || pointers.size > 0) return;
  const dx = e.clientX - g.x;
  const dy = e.clientY - g.y;
  if (dx * dx + dy * dy > 64) return;
  const hit = sheetPoint(e.clientX, e.clientY);
  if (!hit) return;
  land.x = hit.x;
  land.z = hit.z;
  playing = true;
  startedAt = performance.now();
  hint.textContent = '';
}

function onPointerCancel(e) {
  pointers.delete(e.pointerId);
  if (gesture && gesture.id === e.pointerId) gesture = null;
}

renderer.domElement.addEventListener('pointerdown', onPointerDown, true);
renderer.domElement.addEventListener('pointerup', onPointerUp, true);
renderer.domElement.addEventListener('pointercancel', onPointerCancel, true);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop((now) => {
  pose(now);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
