  /* Кадр Figma 1:2 — 1440×800. --k переводит его пиксели во вьюпорт.
     На герое навигация стоит на вертикальной середине, как в макете. */
  :root {
    --bg: #d7d7d7;
    --blue: #0c6df4;
    --blue-fill: #0c7cf4;
    --blue-on: #e1e1e1;
    --grotesk: Arial, "Helvetica Neue", Helvetica, sans-serif;
    --k: calc(100vw / 1440);
    --u: calc(100vh / 800);

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--bg); }

  body {
    color: var(--blue);
    font-family: var(--grotesk);
    -webkit-font-smoothing: antialiased;
  }

  /* Холст живёт всё время: смена hash не пересоздаёт WebGL. */
  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  #app { position: relative; z-index: 2; }

  .chrome { position: relative; }
  .chrome.mid { height: 100vh; }
  .chrome.top { height: calc(210 * var(--k)); }
  .chrome > * { position: absolute; }

  .crosshair {
    left: calc(11.23 * var(--k));
    width: calc(21.535 * var(--k));
    height: calc(21.535 * var(--k));
  }
  .chrome.mid .crosshair { top: calc(50% - 10.77 * var(--k)); }
  .chrome.top .crosshair { top: calc(14 * var(--k)); }

  .nav-text {
    font-size: calc(16 * var(--k));
    line-height: 1.15;
    font-weight: 400;
    white-space: nowrap;
    text-decoration: none;
    color: var(--blue);
  }

  .tagline {
    left: calc(408 * var(--k));
    transform: translateX(-50%);
    text-align: center;
    margin: 0;
  }
  .chrome.mid .tagline { top: calc(50% - 9 * var(--k)); }
  .chrome.top .tagline { top: calc(16 * var(--k)); }

  .nav-index { left: calc(1216 * var(--k)); }
  .chrome.mid .nav-index { top: calc(50% - 8 * var(--k)); }
  .chrome.top .nav-index { top: calc(16 * var(--k)); }

  .nav-about {
    left: calc(1407.05 * var(--k));

  .chrome.mid .nav-about { top: calc(50% - 8 * var(--k)); }

    height: calc(134.883 * var(--k));

  .chrome.mid .mark-regular { top: calc(50% - 56.77 * var(--k)); }
  .chrome.top .mark-vanok { top: calc(12 * var(--k)); }
  .chrome.top .mark-regular { top: calc(36 * var(--k)); }

  a[aria-current="page"] { text-decoration: underline; text-underline-offset: 3px; }
  a.nav-sandbox,
  a.nav-sandbox[aria-current="page"] { text-decoration: none; }

  .sheet {

  .lockup > * { position: absolute; }
  .lockup .mark-vanok {

  .lockup .mark-regular {

  .reel .case {

    margin: 0;
    display: flex;
    flex-direction: column;

  }
  .reel .case + .case,

  .reel .case-meta {
    display: flex;
    gap: calc(12 * var(--k));
    align-items: center;
    margin: 0;
    max-width: none;
    height: calc(16 * var(--k));
    font-size: calc(14 * var(--k));
    line-height: normal;
    color: var(--blue);

  }
  .case-meta span:nth-child(1) { width: calc(107 * var(--k)); flex: none; }
  .case-meta span:nth-child(2) { width: calc(583 * var(--k)); flex: none; }
  .case-meta span:nth-child(3) { width: calc(464 * var(--k)); flex: none; }
  .case-meta .full {
    width: calc(226 * var(--k));
    flex: none;
    text-decoration: underline dotted;
    text-underline-offset: 0.15em;
    cursor: pointer;
  }
  .scroller .full,
  .scroller a,
  .scroller button,
  .scroller.is-drag .full,
  .scroller.is-drag a,
  .scroller.is-drag button { cursor: pointer; }

  .scroller {
    width: 100vw;
    max-width: none;
    margin-left: calc(-12 * var(--k));
    margin-right: calc(-12 * var(--k));
    height: calc(800 * var(--u));
    overflow: hidden;
    scrollbar-width: none;
    cursor: grab;

  .track {

  .board {

  .bar {

  .piece { position: absolute; overflow: hidden; }
  .piece.dark { background: #000; }
  .piece img {
    position: absolute;
    display: block;
    max-width: none;
  }
  .piece .cover { inset: 0; width: 100%; height: 100%; }
  .loose {
    position: absolute;
    display: block;
    max-width: none;
    object-fit: fill;
    pointer-events: none;
  }
  .cover { object-fit: cover; }
  .flip { transform: scaleX(-1); }
  .board img, .board video { -webkit-user-drag: none; user-select: none; }
  .board video { background: transparent; }

  .signoff {
    position: relative;
    width: 100vw;
    height: 100vh;

    align-items: center;

    color: var(--blue);

    height: 100%;

  .sign-lines { display: flex; gap: calc(12 * var(--k)); position: relative; z-index: 1; }
  .sign-lines i {

  }
  .sign-imprints {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .sign-imprint {
    position: absolute;
    display: block;
    transform-origin: center center;
    pointer-events: none;
  }
  .sign-imprint .ink {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
  }
  .sign-imprint .dye {
    position: absolute;
    inset: 0;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  .stamp-panel {
    position: fixed;
    z-index: 40;
    right: 16px;
    bottom: 16px;
    width: min(300px, calc(100vw - 32px));
    max-height: min(680px, calc(100vh - 32px));
    overflow: auto;
    padding: 12px 14px 14px;
    background: #d7d7d7;
    color: #0c6df4;
    border: 1px solid #0c6df4;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;

    line-height: 1.3;
  }
  .stamp-panel[hidden] { display: none; }
  .stamp-panel h2 {

    padding-right: 52px;
    font-size: 14px;

  .stamp-panel .hint { margin: 4px 0 8px; }

  .stamp-panel .tabs button {

  .stamp-panel .tabs button.on { background: #0c6df4; color: #e1e1e1; }
  .stamp-panel .pane[hidden] { display: none; }
  .stamp-panel .close {

  .chrome.strip {
    position: fixed;
    top: 0;

function stripeBars() {
  return Array.from({ length: 13 }, (_, i) => {
    const x = 220 + i * 296;
    return `<i class="bar" style="left: calc(${x} * var(--u))"></i>`;
  }).join('');
}

function shot(src, alt, x, y, w, h, cls = 'cover') {
  const classes = cls ? `loose ${cls}` : 'loose';
  return `<img class="${classes}" alt="${alt}" src="design/board/${src}" style="left: calc(${x} * var(--u)); top: calc(${y} * var(--u)); width: calc(${w} * var(--u)); height: calc(${h} * var(--u))">`;
}

function caseBand(num, title, year, shots) {
  return `<section class="case">
    <p class="case-meta"><span>${num}</span><span>${title}</span><span>${year}</span><span class="full">Full case</span></p>
    <div class="scroller"><div class="track"><div class="board">${stripeBars()}${shots}</div></div></div>
  </section>`;
}

const STRIP_SPEED = 30;
const STRIP_BOOST_MS = 280;
const STRIP_BOOST_IN = 120;
const STRIP_BOOST_OUT = 300;
let stripBoostUntil = 0;
let boostShown = 1;
let boostFrom = 1;
let boostTo = 1;
let boostT0 = 0;

function noteStripBoost() {
  stripBoostUntil = performance.now() + STRIP_BOOST_MS;
}

function stripBoost() {
  const want = performance.now() < stripBoostUntil ? 2 : 1;
  const now = performance.now();
  if (want !== boostTo) {
    boostFrom = boostShown;
    boostTo = want;
    boostT0 = now;
  }
  const dur = boostTo > boostFrom ? STRIP_BOOST_IN : STRIP_BOOST_OUT;
  const u = dur <= 0 ? 1 : Math.min(1, (now - boostT0) / dur);
  const e = u * u * (3 - 2 * u);
  boostShown = boostFrom + (boostTo - boostFrom) * e;
  return boostShown;
}

let lastPageY = null;
function pageScrollY() {
  const root = document.scrollingElement;
  return Math.max(
    window.scrollY || 0,
    root ? root.scrollTop : 0,
    document.body.scrollTop || 0
  );
}
function watchPageScroll() {
  const y = pageScrollY();
  if (lastPageY === null) {
    lastPageY = y;
    return;
  }
  if (y !== lastPageY) {
    lastPageY = y;
    noteStripBoost();
  }
}

  if (event.shiftKey) return false;

}

function softBlobTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.03, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(42,42,42,0.42)');
  grd.addColorStop(0.3, 'rgba(55,55,55,0.18)');
  grd.addColorStop(0.62, 'rgba(70,70,70,0.05)');
  grd.addColorStop(1, 'rgba(70,70,70,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function prepareStamp(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.flatShading = true;
      m.envMapIntensity = o.name === 'Pad' ? 0.08 : 0.2;
      m.needsUpdate = true;
    }
  });
  model.rotation.order = 'YXZ';
  return model;
}

function cloneMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

function prepareApple(gltf, skinHex) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (skinHex != null && (m.name === 'PaleGreen' || m.name === 'green')) {
        m.color.setHex(skinHex);
        m.emissive.setHex(skinHex);
        m.emissiveIntensity = 0.04;
      }
      m.roughness = 0.42;
      m.metalness = 0;
    }
  });
  return fitTopDown(model);
}

function prepareHalfApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (o.isMesh && o.geometry) o.geometry = o.geometry.clone();
  });
  paintApple(model);
  const body = meshByMaterial(model, 'green');
  const stem = meshByMaterial(model, 'brown');
  const flesh = meshByMaterial(model, 'brownLight');
  const leaf = meshByMaterial(model, 'DarkGreen');
  if (flesh && stem && body) {
    const cutN = worldNormal(flesh);
    const stemDir = centerOf(stem).sub(centerOf(body));
    if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
      const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
      const stemFlat = stemDir.normalize().applyQuaternion(qCut);
      stemFlat.y = 0;
      if (stemFlat.lengthSq() > 1e-8) {
        const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
        model.quaternion.copy(qStem.multiply(qCut));
      } else {
        model.quaternion.copy(qCut);
      }
    }
  }
  model.updateMatrixWorld(true);
  if (leaf && body) faceLeafToCamera(leaf, centerOf(body));
  return fitTopDown(model);
}

function prepareGreenStamp(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.color.setHex(STAMP_GREEN);
      m.flatShading = true;
      m.roughness = 0.55;
      m.metalness = 0;
      if (o.name === 'Pad') m.color.multiplyScalar(0.78);
      if (o.name === 'Handle') m.color.multiplyScalar(0.9);
    }
  });
  return fitTopDown(model);
}

    addSlider(pane, rig, 'Непрозрачность', 'opacity', 0.15, 1, 0.01, pct, ink);
    addSlider(pane, rig, 'Размытие', 'blur', 0, 12, 0.1, (n) => n.toFixed(1) + ' px', ink);

    const tintRow = document.createElement('label');
    tintRow.className = 'row';
    const tintHead = document.createElement('span');
    tintHead.textContent = 'Оттенок';
    const tintInput = document.createElement('input');
    tintInput.type = 'color';
    tintInput.value = rig.tint;
    tintInput.addEventListener('input', () => {
      rig.tint = tintInput.value;
      if (ink) paintMarks();
    });
    tintRow.append(tintHead, tintInput);
    pane.append(tintRow);
    addSlider(pane, rig, 'Сила оттенка', 'tintAmount', 0, 1, 0.01, pct, ink);

    const checks = document.createElement('div');
    checks.className = 'checks';
    const liftLabel = document.createElement('label');
    const liftInput = document.createElement('input');
    liftInput.type = 'checkbox';
    liftInput.checked = rig.liftAway;
    liftInput.addEventListener('change', () => { rig.liftAway = liftInput.checked; });
    liftLabel.append(liftInput, document.createTextNode('Уводить после нажатия'));
    checks.append(liftLabel);
    pane.append(checks);
    if (!ink) return;

    function addSelect(label, value, options, onChange) {
      const wrap = document.createElement('label');
      wrap.className = 'row';
      const head = document.createElement('span');
      head.textContent = label;
      const select = document.createElement('select');
      for (const opt of options) {
        const node = document.createElement('option');
        node.value = opt.value;
        node.textContent = opt.label;
        select.append(node);
      }
      select.value = value;
      select.addEventListener('change', () => onChange(select.value));
      wrap.append(head, select);
      pane.append(wrap);
      return select;
    }
    addSelect('Следующее нажатие', rig.stack, [
      { value: 'add', label: 'Добавить ещё оттиск' },
      { value: 'replace', label: 'Заменить оттиск' },
    ], (value) => { rig.stack = value; });
    fileSelect = addSelect('Оттиск', rig.file, [
      { value: 'random', label: 'Случайный' },
      ...STAMP_IMPRINTS.map((item) => ({ value: item.file, label: item.file })),
    ], (value) => {
      rig.file = value;
      refreshFiles();
    });

    const meta = document.createElement('div');
    meta.className = 'meta';
    nextLine = document.createElement('p');
    lastLine = document.createElement('p');
    lastLine.textContent = 'Последний: нет';
    meta.append(nextLine, lastLine);
    const thumbs = document.createElement('div');
    thumbs.className = 'thumbs';
    thumbButtons = STAMP_IMPRINTS.map((item) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.file = item.file;
      btn.title = item.file;
      const img = document.createElement('img');
      img.alt = item.file;
      img.src = item.src;
      btn.append(img);
      btn.addEventListener('click', () => {
        rig.file = item.file;
        fileSelect.value = item.file;
        refreshFiles();
      });
      thumbs.append(btn);
      return btn;
    });
    meta.append(thumbs);
    pane.append(meta);
  }

  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  const stampTab = document.createElement('button');
  stampTab.type = 'button';
  stampTab.textContent = 'Печать';
  stampTab.className = 'on';
  const appleTab = document.createElement('button');
  appleTab.type = 'button';
  appleTab.textContent = 'Яблоко';
  tabs.append(stampTab, appleTab);
  const stampPane = document.createElement('div');
  stampPane.className = 'pane';
  const applePane = document.createElement('div');
  applePane.className = 'pane';
  applePane.hidden = true;
  fillPane(stampPane, stampRig, true);
  fillPane(applePane, appleRig, false);
  function showPane(which) {
    const stampOn = which === 'stamp';
    stampPane.hidden = !stampOn;
    applePane.hidden = stampOn;
    stampTab.classList.toggle('on', stampOn);
    appleTab.classList.toggle('on', !stampOn);
  }
  stampTab.addEventListener('click', () => showPane('stamp'));
  appleTab.addEventListener('click', () => showPane('apple'));
  panel.append(tabs, stampPane, applePane);

  let alive = true;
  let stampModel = null;
  let appleModel = null;
  let model = null;
  let phase = 'hidden';
  let phaseU = 0;
  let shot = null;
  let queued = false;
  let queuedPoint = null;
  let pressN = 0;
  let lastFile = '';
  let lastNow = 0;
  const marks = [];

  function refreshFiles() {
    const show = stampRig.file === 'random' ? lastFile : stampRig.file;
    nextLine.textContent = stampRig.file === 'random'
      ? 'Дальше: случайный'
      : 'Дальше: design/stamps/' + stampRig.file;
    for (const btn of thumbButtons) btn.classList.toggle('on', !!show && btn.dataset.file === show);
  }
  refreshFiles();

  function paintMarks() {
    if (!marks.length || !host.isConnected) return;
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    const diam = (SIZE * stampRig.scale / viewH) * h;
    const imgW = diam / INK_FRAC;
    for (const mark of marks) {
      mark.el.style.left = `calc(${mark.px * 100}% + ${stampRig.offsetX}px)`;
      mark.el.style.top = `calc(${mark.py * 100}% + ${stampRig.offsetY}px)`;
      mark.el.style.width = imgW + 'px';
      mark.el.style.opacity = String(stampRig.opacity);
      mark.el.style.filter = stampRig.blur > 0.01 ? `blur(${stampRig.blur}px)` : 'none';
      mark.el.style.transform = `translate(-50%, -50%) rotate(${mark.rot}deg) scale(${mark.sx}, ${mark.sy})`;
      mark.dye.style.opacity = String(stampRig.tintAmount);
      mark.dye.style.background = stampRig.tint;
    }
  }

  function chooseFile() {
    if (stampRig.file === 'random') {
      return STAMP_IMPRINTS[Math.floor(Math.random() * STAMP_IMPRINTS.length)];
    }
    return STAMP_IMPRINTS.find((item) => item.file === stampRig.file) || STAMP_IMPRINTS[0];
  }

  function sampleShot(point, rig, kind) {
    const choice = kind === 'stamp' ? chooseFile() : { file: 'яблоко', src: '' };
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    return {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
  }

  function placeInk(current) {
    if (current.kind !== 'stamp' || current.placed) return;
    current.placed = true;
    if (stampRig.stack === 'replace') {
      marks.forEach((mark) => mark.el.remove());
      marks.length = 0;
    }
    const el = document.createElement('div');
    el.className = 'sign-imprint';
    const img = document.createElement('img');
    img.className = 'ink';
    img.alt = '';
    img.draggable = false;
    img.src = current.src;
    const dye = document.createElement('div');
    dye.className = 'dye';
    dye.style.webkitMaskImage = `url("${current.src}")`;
    dye.style.maskImage = `url("${current.src}")`;
    el.append(img, dye);
    layer.append(el);
    const pressed = pressScales(stampRig.squash, 1);
    marks.push({ el, dye, rot: current.rot, px: current.px, py: current.py, sx: pressed.x, sy: pressed.y });
    lastLine.textContent = 'Поставлен: design/stamps/' + current.file;
    paintMarks();
  }

  function motionSeconds(base, speed) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    return (reduce ? base * 0.4 : base) / Math.max(0.25, speed);
  }

  function pressSeconds() {
    return matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.08 : 0.2;
  }

  function targetOf(current) {
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const px = current.px * w + current.rig.offsetX;
    const py = current.py * h + current.rig.offsetY;
    const size = SIZE * (current.kind === 'apple' ? current.rig.scale : 1);
    return {
      x: (px / w - 0.5) * viewW,
      z: (py / h - 0.5) * viewH,
      edge: viewH / 2 + size * 0.65,
    };
  }

  function squashCurve(u) {
    if (u < 0.55) return Math.sin((u / 0.55) * Math.PI / 2) * 1.12;
    const v = (u - 0.55) / 0.45;
    return 1.12 - 0.12 * (1 - (1 - v) ** 2);
  }

  function axisPose(prefix) {
    const d = Math.PI / 180;
    const rig = shot.rig;
    return {
      x: rig[prefix + 'X'] * d,
      y: rig[prefix + 'Y'] * d,
      z: rig[prefix + 'Z'] * d,
    };
  }

  function lerpPose(a, b, t) {
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      z: a.z + (b.z - a.z) * t,
    };
  }

  function travelPose(u, from, via, to) {
    if (u <= 0.5) return lerpPose(from, via, u / 0.5);
    return lerpPose(via, to, (u - 0.5) / 0.5);
  }

  function poseFor(name, u) {
    const start = axisPose('start');
    const fly = axisPose('fly');
    const press = axisPose('press');
    if (name === 'descend') return travelPose(u, start, fly, press);
    if (name === 'lift') return travelPose(u, press, fly, start);
    return press;
  }

  function tintObject(root, rig) {
    root.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (!m.userData.baseColor) m.userData.baseColor = m.color.clone();
        m.color.copy(m.userData.baseColor);
        if (rig.tintAmount > 0) m.color.lerp(new THREE.Color(rig.tint), rig.tintAmount);
        m.transparent = rig.opacity < 0.999;
        m.opacity = rig.opacity;
        m.depthWrite = rig.opacity > 0.95;
      }
    });
  }

  function pressScales(squash, amount) {
    const signed = amount * squash;
    return {
      x: Math.max(0.12, 1 + signed),
      y: Math.max(0.12, 1 - signed * 1.35),
    };
  }

  function applyPose(x, z, squashAmt, rot, presence, spin) {
    const rig = shot.rig;
    const size = SIZE * (shot.kind === 'apple' ? rig.scale : 1);
    const pressed = pressScales(rig.squash, squashAmt);
    const spread = pressed.x;
    const squat = pressed.y;
    const euler = spin || poseFor('press', 1);
    if (stampModel) stampModel.visible = false;
    if (appleModel) appleModel.visible = false;
    model.scale.set(size * spread, size * squat, size * spread);
    model.rotation.order = 'XYZ';
    model.rotation.set(euler.x, euler.y - rot * Math.PI / 180, euler.z);
    model.position.set(x, 0.02 - Math.min(1, squashAmt) * 0.012, z);
    model.visible = true;
    if (shot.kind === 'apple') tintObject(model, rig);
    shadow.visible = true;
    shadow.position.set(x + 0.04, 0.002, z + 0.03);
    shadow.material.opacity = 0.1 + presence * 0.22 + Math.min(1, squashAmt) * 0.4;
    shadow.scale.setScalar(1.12 - Math.min(1, squashAmt) * 0.1);
  }

  function kindReady(kind) {
    return kind === 'apple' ? appleModel : stampModel;
  }

  function start(point) {
    const kind = pressN % 2 === 0 ? 'stamp' : 'apple';
    const rig = kind === 'stamp' ? stampRig : appleRig;
    model = kindReady(kind);
    if (!model) {
      queued = true;
      queuedPoint = point;
      return;
    }
    pressN += 1;
    shot = sampleShot(point, rig, kind);
    if (kind === 'stamp') {
      lastFile = shot.file;
      lastLine.textContent = 'Сейчас: design/stamps/' + shot.file;
      refreshFiles();
    } else {
      lastLine.textContent = 'Сейчас: яблоко';
    }
    phase = 'descend';
    phaseU = 0;
    const goal = targetOf(shot);
    applyPose(goal.x, goal.edge, 0, shot.rot, 0, poseFor('descend', 0));
  }

  function step(dt) {
    if (!model || phase === 'hidden') return;
    if (phase === 'rest') {
      if (shot.rig.liftAway) {
        phase = 'lift';
        phaseU = 0;
      } else if (shot) {
        const goal = targetOf(shot);
        applyPose(goal.x, goal.z, 1, shot.rot, 1, poseFor('press', 1));
      }
      return;
    }
    if (!shot) return;
    const goal = targetOf(shot);
    if (phase === 'descend') {
      phaseU += dt / motionSeconds(0.62, shot.rig.descent);
      const u = Math.min(1, phaseU);
      const k = 1 - (1 - u) ** 3;
      applyPose(goal.x, goal.edge + (goal.z - goal.edge) * k, 0, shot.rot, k, poseFor('descend', u));
      if (u >= 1) { phase = 'press'; phaseU = 0; }
    } else if (phase === 'press') {
      phaseU += dt / pressSeconds();
      const u = Math.min(1, phaseU);
      applyPose(goal.x, goal.z, squashCurve(u), shot.rot, 1, poseFor('press', 1));
      if (u >= 0.5) placeInk(shot);
      if (u >= 1) { phase = 'dwell'; phaseU = 0; }
    } else if (phase === 'repress') {
      phaseU += dt / pressSeconds();
      const u = Math.min(1, phaseU);
      const sq = 1 + Math.sin(Math.min(1, u) * Math.PI) * 0.35;
      applyPose(goal.x, goal.z, sq, shot.rot, 1, poseFor('press', 1));
      if (u >= 0.2) placeInk(shot);
      if (u >= 1) { phase = 'dwell'; phaseU = 0; }
    } else if (phase === 'dwell') {
      applyPose(goal.x, goal.z, 1, shot.rot, 1, poseFor('press', 1));
      placeInk(shot);
      if (shot.rig.dwell <= 0.001) {
        phase = shot.rig.liftAway ? 'lift' : 'rest';
        phaseU = 0;
      } else {
        phaseU += dt / shot.rig.dwell;
        if (phaseU >= 1) {
          phase = shot.rig.liftAway ? 'lift' : 'rest';
          phaseU = 0;
        }
      }
    } else if (phase === 'lift') {
      phaseU += dt / motionSeconds(0.42, shot.rig.lift);
      const u = Math.min(1, phaseU);
      const k = u * u;
      const release = Math.max(0, 1 - Math.min(1, u / 0.28));
      applyPose(goal.x, goal.z + (goal.edge - goal.z) * k, release, shot.rot, 1 - k, poseFor('lift', u));
      if (u >= 1) {
        phase = 'hidden';
        model.visible = false;
        shadow.visible = false;
      }
    }
  }

  function onClick(e) {
    if (!alive) return;
    if (phase !== 'hidden' && phase !== 'rest') return;
    const hr = host.getBoundingClientRect();
    const point = { px: e.clientX - hr.left, py: e.clientY - hr.top };
    start(point);
  }
  host.addEventListener('click', onClick);

  function isTyping(el) {
    while (el && el !== document.body) {
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (tag === 'INPUT') {
        const type = (el.type || 'text').toLowerCase();
        return type !== 'range' && type !== 'checkbox' && type !== 'radio' && type !== 'button';
      }
      el = el.parentElement;
    }
    return false;
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === 'Escape' && !panel.hidden && !isTyping(e.target)) {
      panel.hidden = true;
      return;
    }
    if (e.code !== 'KeyG' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target) || isTyping(document.activeElement)) return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  }
  addEventListener('keydown', onKey);
  close.addEventListener('click', () => { panel.hidden = true; });

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    paintMarks();
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  function mountTool(kind, fitted) {
    const group = new THREE.Group();
    group.add(fitted);
    group.scale.setScalar(SIZE);
    group.visible = false;
    scene.add(group);
    if (kind === 'stamp') stampModel = group;
    else appleModel = group;
    if (!queued || !queuedPoint) return;
    const need = pressN % 2 === 0 ? 'stamp' : 'apple';
    if (!kindReady(need)) return;
    const point = queuedPoint;
    queued = false;
    queuedPoint = null;
    start(point);
  }

  new GLTFLoader().load('models/stamp_round.glb', (gltf) => {
    if (!alive) return;
    mountTool('stamp', fitTopDown(prepareStamp(gltf.scene)));
  });
  new GLTFLoader().load('models/apple_half_green.glb', (gltf) => {
    if (!alive) return;
    mountTool('apple', prepareHalfApple(gltf));
  });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0;
    lastNow = now;
    step(dt);
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    host.removeEventListener('click', onClick);
    removeEventListener('keydown', onKey);
    renderer.setAnimationLoop(null);
    ro.disconnect();
    renderer.dispose();
    panel.remove();
    layer.remove();
  };
}

// Полосы 1–4: клик поднимает объект из-за нижнего края, вид строго сверху, и сразу уводит вниз.
function mountBandDrops(root) {
  const bands = [...root.querySelectorAll('.reel .case')].slice(0, 4);
  if (!bands.length) return () => {};

  const layer = document.createElement('div');
  layer.className = 'band-drop';
  const canvas = document.createElement('canvas');
  layer.appendChild(canvas);
  root.appendChild(layer);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 20);
  camera.position.set(0, 8, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const key = new THREE.DirectionalLight(0xfff7f2, 1.8);
  key.position.set(-2.2, 6, -1.6);
  scene.add(key);

  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({
      map: softBlobTexture(),
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      opacity: 0,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.visible = false;
  shadow.renderOrder = -1;
  scene.add(shadow);

  const actors = [null, null, null, null];
  let alive = true;
  let playing = false;
  let startedAt = 0;
  let pending = -1;
  let landX = 0;
  let landZ = 0;
  let offZ = 0;
  let upMs = 620;
  let downMs = 340;
  const SIZE = 0.46;

  function frame() {
    const w = innerWidth;
    const h = innerHeight;
    if (w < 2 || h < 2) return;
    const viewH = 2;
    const viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  frame();
  addEventListener('resize', frame);

  function worldOf(sx, sy) {
    const viewH = camera.top - camera.bottom;
    const viewW = camera.right - camera.left;
    return {
      x: (sx / innerWidth - 0.5) * viewW,
      z: (sy / innerHeight - 0.5) * viewH,
    };
  }

  function pageBottomZ() {
    const radiusPx = (SIZE / 2) * innerHeight / 2 + 36;
    return worldOf(innerWidth / 2, innerHeight + radiusPx).z;
  }

  function begin(index, now) {
    const actor = actors[index];
    if (!actor) {
      pending = index;
      return;
    }
    actors.forEach((item) => { if (item) item.visible = false; });
    const band = bands[index].getBoundingClientRect();
    const visTop = Math.max(band.top, 0);
    const visBot = Math.min(band.bottom, innerHeight);
    const sy = visTop < visBot ? (visTop + visBot) / 2 : band.top + band.height / 2;
    const spot = worldOf(band.left + band.width / 2, sy);
    landX = spot.x;
    landZ = spot.z;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const bottom = pageBottomZ();
    if (reduce) {
      const hop = Math.abs(worldOf(0, 96).z - worldOf(0, 0).z);
      offZ = landZ + Math.min(hop, Math.abs(bottom - landZ));
      upMs = 200;
      downMs = 160;
    } else {
      offZ = bottom;
      upMs = 620;
      downMs = 340;
    }
    actor.visible = true;
    actor.rotation.set(0, 0, 0);
    actor.position.set(landX, 0.03, offZ);
    actor.scale.setScalar(SIZE);
    shadow.visible = true;
    playing = true;
    pending = -1;
    startedAt = now;
  }

  function pose(now) {
    const actor = actors.find((item) => item && item.visible);
    if (!playing || !actor) return;
    const t = now - startedAt;
    let k;
    let z;
    if (t < upMs) {
      k = 1 - (1 - t / upMs) ** 3;
      z = landZ + (offZ - landZ) * (1 - k);
    } else if (t < upMs + downMs) {
      const u = (t - upMs) / downMs;
      k = 1 - (1 - u) ** 2;
      z = landZ + (offZ - landZ) * k;
    } else {
      actor.visible = false;
      shadow.visible = false;
      playing = false;
      return;
    }
    actor.rotation.set(0, 0, 0);
    actor.position.set(landX, 0.03, z);
    shadow.position.set(landX + 0.02, 0.002, z + 0.03);
    const settled = t < upMs ? k : 1 - k;
    shadow.material.opacity = 0.15 + settled * 0.5;
    shadow.scale.setScalar(1.05 - settled * 0.1);
  }

  const stops = bands.map((band, index) => {
    let gesture = null;
    function onDown(e) {
      if (e.button !== 0 || playing) return;
      gesture = { id: e.pointerId, x: e.clientX, y: e.clientY };
    }
    function onUp(e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      const dx = e.clientX - gesture.x;
      const dy = e.clientY - gesture.y;
      gesture = null;
      if (playing || dx * dx + dy * dy > 64) return;
      begin(index, performance.now());
    }
    band.addEventListener('pointerdown', onDown);
    band.addEventListener('pointerup', onUp);
    return () => {
      band.removeEventListener('pointerdown', onDown);
      band.removeEventListener('pointerup', onUp);
    };
  });

  Promise.all([
    new GLTFLoader().loadAsync(APPLE_FILE),
    new GLTFLoader().loadAsync(STAMP_FILE),
  ]).then(([appleGltf, stampGltf]) => {
    if (!alive) return;
    const built = [
      prepareApple(appleGltf, APPLE_RED),
      prepareGreenStamp(stampGltf),
      prepareApple(appleGltf, null),
      prepareGreenStamp(stampGltf),
    ];
    built.forEach((fitted, i) => {
      const rig = new THREE.Group();
      rig.add(fitted);
      rig.visible = false;
      actors[i] = rig;
      scene.add(rig);
    });
    if (pending >= 0 && !playing) begin(pending, performance.now());
  }).catch((err) => { globalThis.__dropErr = String(err); });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    pose(now);
    globalThis.__drop = { playing, pending, n: actors.filter(Boolean).length, t: playing ? now - startedAt : -1 };
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    stops.forEach((stop) => stop());
    removeEventListener('resize', frame);
    renderer.setAnimationLoop(null);
    renderer.dispose();
    layer.remove();
  };
}

function mountScroller(scroller, index) {
  const board = scroller.querySelector('.board');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  // Odd bands: pictures travel right → left (scrollLeft grows).
  // Even bands: pictures travel left → right (scrollLeft shrinks).
  const dir = index % 2 === 0 ? 1 : -1;
  let alive = true;
  let drag = null;
  let wrapping = false;
  let primed = dir > 0;
  let pos = scroller.scrollLeft;

  function park(next) {
    const loop = loopWidth();
    if (loop > 0) next = ((next % loop) + loop) % loop;
    pos = next;
    wrapping = true;
    scroller.scrollLeft = next;
    wrapping = false;
  }

  function loopWidth() {
    return board.getBoundingClientRect().width;
  }

  function ensureCopies() {
    if (!alive) return;
    const loop = loopWidth();
    if (loop <= 0) return;
    const need = Math.max(2, Math.ceil(scroller.clientWidth / loop) + 1);
    const track = board.parentElement;
    while (track.children.length < need) {
      const copy = board.cloneNode(true);
      copy.setAttribute('aria-hidden', 'true');
      track.appendChild(copy);
      copy.querySelectorAll('video').forEach((video) => {
        video.muted = true;
        video.play().catch(() => {});
      });
    }
  }

  function wrap() {
    const loop = loopWidth();
    if (loop <= 0 || wrapping) return;
    const x = scroller.scrollLeft;
    if (x >= loop) park(x - loop);
    else if (x < 0) park(x + loop);
  }

  function onWheel(event) {
    if (!wheelScrollsPage(event)) event.preventDefault();
  }

  function onScroll() {
    if (!wrapping) wrap();
  }

  function onDown(event) {
    if (event.button !== 0) return;
    drag = { x: event.clientX, left: scroller.scrollLeft };
    scroller.classList.add('is-drag');
    try { scroller.setPointerCapture(event.pointerId); } catch (err) { /* synthetic */ }
  }

  function onMove(event) {
    if (!drag) return;
    const loop = loopWidth();
    let next = drag.left - (event.clientX - drag.x);
    if (loop > 0) next = ((next % loop) + loop) % loop;
    pos = next;
    scroller.scrollLeft = next;
  }

  function onUp() {
    drag = null;
    scroller.classList.remove('is-drag');
  }

  ensureCopies();
  board.querySelectorAll('video').forEach((video) => {
    video.muted = true;
    video.play().catch(() => {});
  });
  addEventListener('resize', ensureCopies);
  scroller.addEventListener('wheel', onWheel, { passive: false });
  scroller.addEventListener('scroll', onScroll, { passive: true });
  scroller.addEventListener('pointerdown', onDown);
  scroller.addEventListener('pointermove', onMove);
  scroller.addEventListener('pointerup', onUp);
  scroller.addEventListener('pointercancel', onUp);

  let last = performance.now();
  function tick(now) {
    if (!alive) return;
    watchPageScroll();
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    const loop = loopWidth();
    if (loop > 0 && !primed) {
      primed = true;
      park(loop);
    }
    if (!motion.matches && !drag && loop > 0) {
      const boost = stripBoost();
      park(pos + dir * STRIP_SPEED * boost * (loop / STRIP_W) * dt);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  return () => {
    alive = false;
    removeEventListener('resize', ensureCopies);
  };
}

function nearestTurn(target, current) {
  const tau = Math.PI * 2;
  return target + Math.round((current - target) / tau) * tau;

function launch(tx, ty) {

  phase = 'fly';
  if (fy > ty + 0.012) {
    vy = -Math.sqrt(2 * G * (fy - ty + 0.16));
  } else {
    vy = 0.02;
  }
}

function shadowTexture() {
  const s = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.02, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(58,58,58,0.55)');
  grd.addColorStop(0.22, 'rgba(68,68,68,0.22)');
  grd.addColorStop(0.5, 'rgba(80,80,80,0.07)');
  grd.addColorStop(1, 'rgba(80,80,80,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function materialsOf(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

function smoothShade(root, tolerance = 1e-4) {
  let before = 0, after = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.geometry;
    before += src.attributes.position.count;
    for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) src.deleteAttribute(name);
    const merged = BufferGeometryUtils.mergeVertices(src, tolerance);
    merged.computeVertexNormals();
    src.dispose();
    o.geometry = merged;
    after += merged.attributes.position.count;
    for (const m of materialsOf(o)) {
      m.flatShading = false;
      m.needsUpdate = true;
    }
  });
  return { before, after };
}

function meshByMaterial(root, name) {
  let found = null;
  root.traverse((o) => {
    if (o.isMesh && materialsOf(o).some((m) => m.name === name)) found = o;
  });
  return found;
}

function paintApple(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of materialsOf(o)) {
      const look = LOOK[m.name];
      if (!look) continue;
      m.color.setHex(look.color);
      m.emissive.setHex(look.emissive);
      m.emissiveIntensity = look.emissiveIntensity;
      m.metalness = look.metalness;
      m.roughness = look.roughness;
      const skin = m.name === 'PaleGreen' || m.name === 'green';
      m.envMapIntensity = skin ? 0.22 : 0.12;
      m.side = m.name === 'DarkGreen' ? THREE.DoubleSide : THREE.FrontSide;
      m.flatShading = false;
      if (m.name === 'brownDark') {
        m.polygonOffset = true;
        m.polygonOffsetFactor = -2;
        m.polygonOffsetUnits = -2;
      }
      m.needsUpdate = true;
    }
  });
}

// Лист в модели стоит ребром. Разворачиваем пластинку нормалью к камере,
// вращая вокруг основания — ближайшей к телу вершины.
function faceLeafToCamera(leaf, bodyCenter) {
  const viewDir = new THREE.Vector3(0, 1, 0);
  leaf.updateWorldMatrix(true, false);
  const toWorld = leaf.matrixWorld;
  const attr = leaf.geometry.attributes.position;
  const pts = [];
  for (let i = 0; i < attr.count; i++) {
    pts.push(new THREE.Vector3().fromBufferAttribute(attr, i).applyMatrix4(toWorld));
  }
  const mean = new THREE.Vector3();
  for (const p of pts) mean.add(p);
  mean.multiplyScalar(1 / pts.length);

  const c = new Array(9).fill(0);
  for (const p of pts) {
    const d = p.clone().sub(mean);
    c[0] += d.x * d.x; c[1] += d.x * d.y; c[2] += d.x * d.z;
    c[4] += d.y * d.y; c[5] += d.y * d.z; c[8] += d.z * d.z;
  }
  c[3] = c[1]; c[6] = c[2]; c[7] = c[5];
  const trace = c[0] + c[4] + c[8];
  const m = c.map((x, i) => (i % 4 === 0 ? trace - x : -x));
  const n = new THREE.Vector3(0.41, 0.82, 0.41).normalize();
  for (let i = 0; i < 80; i++) {
    n.set(
      m[0] * n.x + m[1] * n.y + m[2] * n.z,
      m[3] * n.x + m[4] * n.y + m[5] * n.z,
      m[6] * n.x + m[7] * n.y + m[8] * n.z,
    ).normalize();
  }
  if (n.dot(viewDir) < 0) n.negate();

  let base = pts[0], best = Infinity;
  for (const p of pts) {
    const d2 = p.distanceToSquared(bodyCenter);
    if (d2 < best) { best = d2; base = p; }
  }
  const world = new THREE.Matrix4()
    .makeTranslation(base.x, base.y, base.z)
    .multiply(new THREE.Matrix4().makeRotationFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(n, viewDir)))
    .multiply(new THREE.Matrix4().makeTranslation(-base.x, -base.y, -base.z));
  const inv = new THREE.Matrix4().copy(toWorld).invert();
  leaf.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, world).multiply(toWorld));
  leaf.geometry.computeVertexNormals();
}

function centerOf(mesh) {
  return new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
}

function worldNormal(mesh) {
  const attr = mesh.geometry.attributes.normal;
  const n = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  for (let i = 0; i < attr.count; i++) n.add(tmp.fromBufferAttribute(attr, i));
  mesh.updateWorldMatrix(true, false);
  return n.transformDirection(mesh.matrixWorld).normalize();
}

function updateCamera() {
  const w = innerWidth, h = innerHeight;
  const applePx = APPLE_D * (w / DESIGN_W);
  const worldPerPx = 1 / applePx;
  const visibleW = w * worldPerPx;
  const visibleH = h * worldPerPx;
  const sx = fx * w;
  const sy = fy * h;
  camera.left = -(sx / w) * visibleW;
  camera.right = camera.left + visibleW;
  camera.top = (sy / h) * visibleH;
  camera.bottom = camera.top - visibleH;
  camera.updateProjectionMatrix();
}

function step(dt) {
  if (phase === 'fly') {
    flyT += dt;
    const prev = fy;
    vy += G * dt;
    fy += vy * dt;
    fx += (destFx - fx) * (1 - Math.exp(-5 * dt));
    yaw += yawVel * dt;
    yawVel *= Math.exp(-dt * 0.55);
    if (vy > 0 && prev <= destFy && fy >= destFy) {
      fy = destFy;
      if (Math.abs(vy) < 0.34) {
        vy = 0;
        phase = 'settle';
      } else {
        vy = -vy * e;
        e *= 0.73;
        yawVel += 1.8 + Math.abs(vy) * 1.4;
      }
    }
    if (flyT > 7) {
      fx = destFx;
      fy = destFy;
      vy = 0;
      phase = 'settle';
    }
    const air = Math.min(Math.abs(vy) * 0.45, 0.4);
    spin.scale.setScalar(1 + air * 0.07);
    shadow.scale.setScalar(4.1 * (1 + air * 0.35));
    shadowMat.opacity = 0.48 * (1 - air * 0.28);
  } else if (phase === 'scroll') {
    const target = -scrollY * SPIN_PER_PX;
    yaw += (target - yaw) * (1 - Math.exp(-dt * 8));
    yawVel = 0;
    const a = heroAnchor();
    fx += (a.fx - fx) * (1 - Math.exp(-dt * 10));
    fy += (a.fy - fy) * (1 - Math.exp(-dt * 10));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
  } else if (phase === 'settle') {
    const raw = route === 'hero' ? -scrollY * SPIN_PER_PX : 0;
    const target = route === 'hero' ? raw : nearestTurn(raw, yaw);
    yaw += (target - yaw) * (1 - Math.exp(-dt * 4));
    yawVel = 0;
    fx += (destFx - fx) * (1 - Math.exp(-dt * 8));
    fy += (destFy - fy) * (1 - Math.exp(-dt * 8));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
    if (Math.abs(target - yaw) < 0.02 && Math.abs(destFy - fy) < 0.004) {
      phase = route === 'hero' ? 'scroll' : 'rest';
    }
  } else {
    yaw += (nearestTurn(0, yaw) - yaw) * (1 - Math.exp(-dt * 4));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
  }
  const scrollQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const pitchQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dragPitch);
  const turnQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), dragYaw);
  spin.quaternion.copy(turnQ).multiply(pitchQ).multiply(scrollQ);
}

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();

function overInteractive(event) {
  const t = event.target;
  return t instanceof Element && !!t.closest('a, button, input, textarea, select, summary, label, .scroller');
}

function pointerHitsApple(event) {
  pointerNdc.set((event.clientX / innerWidth) * 2 - 1, -(event.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointerNdc, camera);
  return raycaster.intersectObject(model, true).length > 0;
}

  if (overInteractive(event)) return;
  if (!pointerHitsApple(event)) return;
  grab = { id: event.pointerId, x: event.clientX, y: event.clientY };
  document.body.style.cursor = 'grabbing';
  event.preventDefault();
});

  if (document.body.dataset.route === 'board') {
    if (grab) grab = null;
    if (document.body.style.cursor) document.body.style.cursor = '';
    return;
  }
  if (grab && event.pointerId === grab.id) {
    const dx = event.clientX - grab.x;
    const dy = event.clientY - grab.y;
    grab.x = event.clientX;
    grab.y = event.clientY;
    dragYaw += dx * 0.012;
    dragPitch = Math.max(-1.35, Math.min(1.35, dragPitch + dy * 0.012));
    return;
  }
  if (grab) return;
  document.body.style.cursor = !overInteractive(event) && pointerHitsApple(event) ? 'grab' : '';
});

function endGrab(event) {
  if (!grab || event.pointerId !== grab.id) return;

    model: 'models/apple_half_green.glb',
    body: col.getStyle(),
    stem: materialsOf(stem).find((m) => m.name === 'brown').color.getStyle(),
    flesh: materialsOf(flesh).find((m) => m.name === 'brownLight').color.getStyle(),
    scrollY,
  }),
};
</script>
