  .scroller .full,

  .scroller button,
  .scroller.is-drag .full,

  .scroller {

    display: block;

  .piece .cover { inset: 0; width: 100%; height: 100%; }
  .loose {
    position: absolute;
    display: block;
    max-width: none;
    object-fit: fill;
    pointer-events: none;

  .flip { transform: scaleX(-1); }

function stripeBars() {

    const x = 220 + i * 296;
    return `<i class="bar" style="left: calc(${x} * var(--u))"></i>`;
  }).join('');
}

function shot(src, alt, x, y, w, h, cls = 'cover') {
  const classes = cls ? `loose ${cls}` : 'loose';

}

}

function parseRoute() {
  const raw = (location.hash || '').replace(/^#/, '').replace(/^\//, '');
  if (raw === 'index') return 'index';
  if (raw === 'about') return 'about';
  if (raw === 'board') return 'board';
  return 'hero';
}

function heroAnchor() {
  const k = innerWidth / DESIGN_W;
  return {
    fx: APPLE_CX / DESIGN_W,
    fy: 0.5 + (APPLE_CY - DESIGN_MID) * k / innerHeight,
  };
}

function anchorFor(name) {
  if (name === 'index') return { fx: 0.5, fy: 0.7 };
  if (name === 'about') return { fx: 0.7, fy: 0.58 };
  if (name === 'board') return { fx: 0.88, fy: 0.12 };

}

function softBlobTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.03, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(42,42,42,0.42)');
  grd.addColorStop(0.3, 'rgba(55,55,55,0.18)');
  grd.addColorStop(0.62, 'rgba(70,70,70,0.05)');
  grd.addColorStop(1, 'rgba(70,70,70,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function prepareStamp(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.flatShading = true;
      m.envMapIntensity = o.name === 'Pad' ? 0.08 : 0.2;
      m.needsUpdate = true;
    }
  });
  model.rotation.order = 'YXZ';
  return model;
}

const APPLE_FILE = 'models/apple_green_quaternius.glb';
const STAMP_FILE = 'models/stamp_round.glb';
const APPLE_GREEN = 0xaaff28;
const APPLE_RED = 0xe23b32;
const STAMP_GREEN = 0x3faa38;

function cloneMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

function prepareApple(gltf, skinHex) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (m.name === 'PaleGreen' || m.name === 'green') {
        m.color.setHex(skinHex);
        m.emissive.setHex(skinHex);
        m.emissiveIntensity = 0.04;
      }
      m.roughness = 0.42;
      m.metalness = 0;
    }
  });
  return fitTopDown(model);
}

function prepareGreenStamp(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.color.setHex(STAMP_GREEN);
      m.flatShading = true;
      m.roughness = 0.55;
      m.metalness = 0;
      if (o.name === 'Pad') m.color.multiplyScalar(0.78);
      if (o.name === 'Handle') m.color.multiplyScalar(0.9);
    }
  });
  return fitTopDown(model);
}

// Шапка #/board: яблоко сверху. Тянешь мышью — крутится, цифры остаются на экране.
function mountHeaderStamp(host) {
  if (!host) return () => {};
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 20);
  camera.position.set(0, 6, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const key = new THREE.DirectionalLight(0xfff7f2, 2.5);
  key.position.set(-2.4, 5.2, -1.7);
  key.target.position.set(0, 0.2, 0.4);
  scene.add(key, key.target);

  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({
      map: softBlobTexture(),
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      opacity: 0.9,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.scale.set(1.05, 1.05, 1);
  shadow.position.set(-0.04, 0.002, -0.02);
  shadow.renderOrder = -1;
  scene.add(shadow);

  const tilt = new THREE.Group();
  tilt.position.set(-0.33, 0, -0.72);
  scene.add(tilt);

  let alive = true;
  let model = null;
  let rotX = 0;
  let rotY = 0;
  let rotZ = 0;
  let drag = null;
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  const readout = document.createElement('p');
  readout.className = 'apple-readout';
  document.body.appendChild(readout);

  function formatDeg(rad) {
    const wrapped = ((rad * 180 / Math.PI + 180) % 360 + 360) % 360 - 180;
    return wrapped.toFixed(1);
  }
  function paintReadout() {
    readout.textContent = `X ${formatDeg(rotX)}°\nY ${formatDeg(rotY)}°\nZ ${formatDeg(rotZ)}°`;
  }
  paintReadout();

  function hitApple(e) {
    if (!model) return false;
    const rect = renderer.domElement.getBoundingClientRect();
    if (rect.width < 1 || rect.height < 1) return false;
    ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    return raycaster.intersectObject(tilt, true).length > 0;
  }

  function onDown(e) {
    if (!alive || (e.button !== 0 && e.button !== 2)) return;
    if (e.target instanceof Element && e.target.closest('a')) return;
    const rect = renderer.domElement.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.36;
    const cy = rect.top + rect.height * 0.2;
    const reach = Math.min(rect.width, rect.height) * 0.28;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    if (!hitApple(e) && dx * dx + dy * dy > reach * reach) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, zAxis: e.button === 2 || e.shiftKey };
    e.preventDefault();
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    drag.x = e.clientX;
    drag.y = e.clientY;
    const step = 0.55 * Math.PI / 180;
    if (drag.zAxis || e.shiftKey) rotZ += dx * step;
    else {
      rotY += dx * step;
      rotX += dy * step;
    }
    tilt.rotation.set(rotX, rotY, rotZ);
    paintReadout();
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
  }
  addEventListener('pointerdown', onDown);
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
  addEventListener('pointercancel', onUp);

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    const viewH = 2.4;
    const viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  new GLTFLoader().load(APPLE_FILE, (gltf) => {
    if (!alive) return;
    const fitted = prepareApple(gltf, APPLE_GREEN);
    model = new THREE.Group();
    model.scale.setScalar(0.78);
    model.add(fitted);
    tilt.add(model);
  });

  renderer.setAnimationLoop(() => {
    if (!alive) return;
    tilt.rotation.set(rotX, rotY, rotZ);
    renderer.render(scene, camera);
  });

  globalThis.__headerStamp = () => ({ x: formatDeg(rotX), y: formatDeg(rotY), z: formatDeg(rotZ) });

  return () => {
    alive = false;
    removeEventListener('pointerdown', onDown);
    removeEventListener('pointermove', onMove);
    removeEventListener('pointerup', onUp);
    removeEventListener('pointercancel', onUp);
    readout.remove();
    renderer.setAnimationLoop(null);
    ro.disconnect();
    pmrem.dispose();
    renderer.dispose();
    renderer.domElement.remove();
    if (globalThis.__headerStamp) delete globalThis.__headerStamp;
  };
}

// Последний экран: один клик — печать падает на линию и остаётся.
function mountSignStamp(host) {
  if (!host) return () => {};
  const canvas = document.createElement('canvas');
  canvas.className = 'sign-stage';
  host.appendChild(canvas);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 40);
  camera.position.set(0.2, 1.12, 2.7);
  camera.lookAt(0, 0, 0);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.3);
  key.position.set(-1.7, 3.6, 1.4);
  scene.add(key);

  const SIZE = 0.52;
  const DROP = 760;
  const PRESS = 120;
  const START_Y = 1.62;

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.34, 40),
    new THREE.MeshBasicMaterial({
      map: softBlobTexture(),
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      opacity: 0,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0.07, 0.004, 0.05);
  shadow.visible = false;
  scene.add(shadow);

  let alive = true;
  let model = null;
  let playing = false;
  let placed = false;
  let want = false;
  let startedAt = 0;

  function easeInCubic(t) { return t * t * t; }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function setScale(x, y, z) {
    model.scale.set(SIZE * x, SIZE * y, SIZE * z);
  }

  function shade() {
    const y = model.position.y;
    const k = 1 - Math.min(Math.max(y, 0) / START_Y, 1);
    shadow.material.opacity = 0.12 + k * 0.7;
    const s = 1.28 - k * 0.32;
    shadow.scale.set(s, s, 1);
  }

  function begin(now) {
    playing = true;
    startedAt = now;
    model.visible = true;
    shadow.visible = true;
    model.position.set(0, START_Y, 0);
    model.rotation.set(-0.4, Math.PI * 0.8, 0.2);
    setScale(1, 1, 1);
    shade();
  }

  function pose(now) {
    if (!model) return;
    if (!playing) {
      if (placed) shade();
      return;
    }
    const t = now - startedAt;
    if (t < DROP) {
      const k = easeInCubic(t / DROP);
      const r = easeInOut(t / DROP);
      model.position.set(0, lerp(START_Y, 0, k), 0);
      model.rotation.set(lerp(-0.4, 0, r), lerp(Math.PI * 0.8, 0, r), lerp(0.2, 0, r));
      setScale(1, 1, 1);
      shade();
      return;
    }
    if (t < DROP + PRESS) {
      const s = Math.sin(((t - DROP) / PRESS) * Math.PI);
      model.position.set(0, 0, 0);
      model.rotation.set(0, 0, 0);
      setScale(1 + s * 0.045, 1 - s * 0.09, 1 + s * 0.045);
      shade();
      return;
    }
    model.position.set(0, 0, 0);
    model.rotation.set(0, 0, 0);
    setScale(1, 1, 1);
    shade();
    playing = false;
    placed = true;
    host.classList.add('is-placed');
  }

  function onClick() {
    if (!alive || playing || placed) return;
    want = true;
    if (model) begin(performance.now());
  }
  host.addEventListener('click', onClick);

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  new GLTFLoader().load('models/stamp_round.glb', (gltf) => {
    if (!alive) return;
    model = prepareStamp(gltf.scene);
    model.visible = false;
    scene.add(model);
    if (want && !playing && !placed) begin(performance.now());
  });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    pose(now);
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    host.removeEventListener('click', onClick);
    renderer.setAnimationLoop(null);
    ro.disconnect();
    pmrem.dispose();
    renderer.dispose();
  };
}

// Полосы 1–4: клик поднимает объект из-за нижнего края, вид строго сверху, и сразу уводит вниз.
function mountBandDrops(root) {
  const bands = [...root.querySelectorAll('.reel .case')].slice(0, 4);
  if (!bands.length) return () => {};

  const layer = document.createElement('div');
  layer.className = 'band-drop';
  const canvas = document.createElement('canvas');
  layer.appendChild(canvas);
  root.appendChild(layer);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 20);
  camera.position.set(0, 8, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const key = new THREE.DirectionalLight(0xfff7f2, 1.8);
  key.position.set(-2.2, 6, -1.6);
  scene.add(key);

  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({
      map: softBlobTexture(),
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      opacity: 0,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.visible = false;
  shadow.renderOrder = -1;
  scene.add(shadow);

  const actors = [null, null, null, null];
  let alive = true;
  let playing = false;
  let startedAt = 0;
  let pending = -1;
  let landX = 0;
  let landZ = 0;
  const UP = 620;
  const DOWN = 480;
  const SIZE = 0.46;

  function frame() {
    const w = innerWidth;
    const h = innerHeight;
    if (w < 2 || h < 2) return;
    const viewH = 2;
    const viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  frame();
  addEventListener('resize', frame);

  function worldOf(sx, sy) {
    const viewH = camera.top - camera.bottom;
    const viewW = camera.right - camera.left;
    return {
      x: (sx / innerWidth - 0.5) * viewW,
      z: (sy / innerHeight - 0.5) * viewH,
    };
  }

  function begin(index, now) {
    const actor = actors[index];
    if (!actor) {
      pending = index;
      return;
    }
    actors.forEach((item) => { if (item) item.visible = false; });
    const band = bands[index].getBoundingClientRect();
    const sx = Math.max(innerWidth * 0.22, Math.min(innerWidth * 0.78, band.left + band.width / 2));
    const sy = Math.max(innerHeight * 0.28, Math.min(innerHeight * 0.62, band.top + band.height / 2));
    const spot = worldOf(sx, sy);
    landX = spot.x;
    landZ = spot.z;
    actor.visible = true;
    actor.scale.setScalar(SIZE);
    shadow.visible = true;
    playing = true;
    pending = -1;
    startedAt = now;
  }

  function pose(now) {
    const actor = actors.find((item) => item && item.visible);
    if (!playing || !actor) return;
    const radiusPx = (SIZE / 2) * innerHeight / 2 + 18;
    const below = worldOf(innerWidth / 2, innerHeight + radiusPx);
    const t = now - startedAt;
    let k;
    let z;
    if (t < UP) {
      k = 1 - (1 - t / UP) ** 3;
      z = landZ + (below.z - landZ) * (1 - k);
    } else if (t < UP + DOWN) {
      k = ((t - UP) / DOWN) ** 3;
      z = landZ + (below.z - landZ) * k;
    } else {
      actor.visible = false;
      shadow.visible = false;
      playing = false;
      return;
    }
    actor.position.set(landX, 0.03, z);
    shadow.position.set(landX + 0.1, 0.002, z + 0.12);
    const settled = t < UP ? k : 1 - k;
    shadow.material.opacity = 0.2 + settled * 0.65;
    shadow.scale.setScalar(1.15 - settled * 0.18);
  }

  const stops = bands.map((band, index) => {
    let gesture = null;
    function onDown(e) {
      if (e.button !== 0 || playing) return;
      gesture = { id: e.pointerId, x: e.clientX, y: e.clientY };
    }
    function onUp(e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      const dx = e.clientX - gesture.x;
      const dy = e.clientY - gesture.y;
      gesture = null;
      if (playing || dx * dx + dy * dy > 64) return;
      begin(index, performance.now());
    }
    band.addEventListener('pointerdown', onDown);
    band.addEventListener('pointerup', onUp);
    return () => {
      band.removeEventListener('pointerdown', onDown);
      band.removeEventListener('pointerup', onUp);
    };
  });

  Promise.all([
    new GLTFLoader().loadAsync(APPLE_FILE),
    new GLTFLoader().loadAsync(STAMP_FILE),
  ]).then(([appleGltf, stampGltf]) => {
    if (!alive) return;
    const built = [
      prepareApple(appleGltf, APPLE_RED),
      prepareGreenStamp(stampGltf),
      prepareApple(appleGltf, APPLE_GREEN),
      prepareGreenStamp(stampGltf),
    ];
    built.forEach((fitted, i) => {
      const rig = new THREE.Group();
      rig.add(fitted);
      rig.visible = false;
      actors[i] = rig;
      scene.add(rig);
    });
    if (pending >= 0 && !playing) begin(pending, performance.now());
  }).catch((err) => { globalThis.__dropErr = String(err); });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    pose(now);
    globalThis.__drop = { playing, pending, n: actors.filter(Boolean).length, t: playing ? now - startedAt : -1 };
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    stops.forEach((stop) => stop());
    removeEventListener('resize', frame);
    renderer.setAnimationLoop(null);
    renderer.dispose();
    layer.remove();
  };
}

function mountBoardFx(root) {
  const stopHeader = mountHeaderStamp(root.querySelector('.peek'));
  const stopSign = mountSignStamp(root.querySelector('.signoff'));
  const stopBands = mountBandDrops(root);
  return () => {
    stopHeader();
    stopSign();
    stopBands();
  };
}

function mountStrip(root) {
  const stops = [...root.querySelectorAll('.scroller')].map((scroller, index) => mountScroller(scroller, index));
  const stopFx = mountBoardFx(root);
  return () => {
    stops.forEach((stop) => stop());
    stopFx();
  };
}

function mountScroller(scroller, index) {
  const board = scroller.querySelector('.board');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  // Odd bands: pictures travel right → left (scrollLeft grows).
  // Even bands: pictures travel left → right (scrollLeft shrinks).
  const dir = index % 2 === 0 ? 1 : -1;
  let alive = true;
  let drag = null;
  let wrapping = false;
  let primed = dir > 0;

  function park(next) {
    const loop = loopWidth();
    if (loop > 0) next = ((next % loop) + loop) % loop;
    wrapping = true;
    scroller.scrollLeft = next;
    wrapping = false;
  }

  function loopWidth() {
    return board.getBoundingClientRect().width;
  }

  function ensureCopies() {
    if (!alive) return;
    const loop = loopWidth();
    if (loop <= 0) return;
    const need = Math.max(2, Math.ceil(scroller.clientWidth / loop) + 1);
    const track = board.parentElement;
    while (track.children.length < need) {
      const copy = board.cloneNode(true);
      copy.setAttribute('aria-hidden', 'true');
      track.appendChild(copy);
      copy.querySelectorAll('video').forEach((video) => {
        video.muted = true;
        video.play().catch(() => {});
      });
    }
  }

  function wrap() {
    const loop = loopWidth();
    if (loop <= 0 || wrapping) return;
    const x = scroller.scrollLeft;
    if (x >= loop) {
      wrapping = true;
      scroller.scrollLeft = x - loop;
      wrapping = false;
    } else if (x < 0) {
      wrapping = true;
      scroller.scrollLeft = x + loop;
      wrapping = false;
    }
  }

  function onWheel(event) {
    const horizontal = event.shiftKey || Math.abs(event.deltaX) > Math.abs(event.deltaY);
    if (horizontal) event.preventDefault();
  }

  function onScroll() {
    if (!wrapping) wrap();
  }

  function onDown(event) {
    if (event.button !== 0) return;
    drag = { x: event.clientX, left: scroller.scrollLeft };
    scroller.classList.add('is-drag');
    try { scroller.setPointerCapture(event.pointerId); } catch (err) { /* synthetic */ }
  }

  function onMove(event) {
    if (!drag) return;
    const loop = loopWidth();
    let next = drag.left - (event.clientX - drag.x);
    if (loop > 0) next = ((next % loop) + loop) % loop;
    scroller.scrollLeft = next;
  }

  function onUp() {
    drag = null;
    scroller.classList.remove('is-drag');
  }

  ensureCopies();
  board.querySelectorAll('video').forEach((video) => {
    video.muted = true;
    video.play().catch(() => {});
  });
  addEventListener('resize', ensureCopies);
  scroller.addEventListener('wheel', onWheel, { passive: false });
  scroller.addEventListener('scroll', onScroll, { passive: true });
  scroller.addEventListener('pointerdown', onDown);
  scroller.addEventListener('pointermove', onMove);
  scroller.addEventListener('pointerup', onUp);
  scroller.addEventListener('pointercancel', onUp);

  let last = performance.now();
  function tick(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const loop = loopWidth();
    if (loop > 0 && !primed) {
      primed = true;
      park(loop);
    }
    if (!motion.matches && !drag && loop > 0) {
      park(scroller.scrollLeft + dir * STRIP_SPEED * (loop / STRIP_W) * dt);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  return () => {
    alive = false;
    removeEventListener('resize', ensureCopies);
  };
}

function paint(name) {
  if (unmountStrip) {
    unmountStrip();
    unmountStrip = null;
  }
  document.body.dataset.route = name;
  app.innerHTML = TEMPLATES[name]();
  if (name === 'board') unmountStrip = mountStrip(app);
}

function nearestTurn(target, current) {
  const tau = Math.PI * 2;
  return target + Math.round((current - target) / tau) * tau;
}

function launch(tx, ty) {
  destFx = tx;
  destFy = ty;
  e = 0.64;
  flyT = 0;
  yawVel += 3.6;
  if (Math.abs(fy - ty) < 0.02 && Math.abs(fx - tx) < 0.02) {
    phase = 'settle';
    vy = 0;
    return;
  }
  phase = 'fly';
  if (fy > ty + 0.012) {
    vy = -Math.sqrt(2 * G * (fy - ty + 0.16));
  } else {
    vy = 0.02;
  }
}

paint(route);
{
  const a = anchorFor(route);
  fx = destFx = a.fx;
  fy = destFy = a.fy;
  phase = route === 'hero' ? 'scroll' : 'rest';
}

addEventListener('hashchange', () => {
  const next = parseRoute();
  if (next === route) return;
  route = next;
  paint(route);
  scrollTo(0, 0);
  const a = anchorFor(route);
  if (ready) launch(a.fx, a.fy);
  else {
    fx = destFx = a.fx;
    fy = destFy = a.fy;
    phase = route === 'hero' ? 'scroll' : 'rest';
  }
});

// --- сцена: камера всегда строго над яблоком --------------------------------

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearAlpha(0);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 80);
camera.position.set(0, 40, 0);
camera.up.set(0, 0, 1);
camera.lookAt(0, 0, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.16;

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
scene.add(new THREE.HemisphereLight(0xfff6ea, 0xd5d8cc, 0.2));
const key = new THREE.DirectionalLight(0xfff8ee, 0.78);
key.position.set(-2.4, 7.5, 3.4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.1);
fill.position.set(2.4, 5, -1.6);
scene.add(fill);

function shadowTexture() {
  const s = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.02, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(58,58,58,0.55)');
  grd.addColorStop(0.22, 'rgba(68,68,68,0.22)');
  grd.addColorStop(0.5, 'rgba(80,80,80,0.07)');
  grd.addColorStop(1, 'rgba(80,80,80,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

const shadowMat = new THREE.MeshBasicMaterial({
  map: shadowTexture(),
  transparent: true,
  depthWrite: false,
  toneMapped: false,
  opacity: 0.48,
  side: THREE.DoubleSide,
});
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat);
shadow.position.set(0.4, -1.2, -0.22);
shadow.scale.setScalar(4.1);
shadow.lookAt(camera.position);
shadow.renderOrder = -2;
scene.add(shadow);

const spin = new THREE.Group();
const aim = new THREE.Group();
spin.add(aim);
scene.add(spin);

const SKIN = { color: 0xaaff28, emissive: 0xb4f040, emissiveIntensity: 0.1, metalness: 0, roughness: 0.42 };
const STEM = { color: 0x7a4e28, emissive: 0x000000, emissiveIntensity: 0, metalness: 0, roughness: 0.64 };
const LEAF = { color: 0x2f861f, emissive: 0x14300a, emissiveIntensity: 0.18, metalness: 0, roughness: 0.52 };
const FLESH = { color: 0xf6e0b8, emissive: 0xf0d0a0, emissiveIntensity: 0.08, metalness: 0, roughness: 0.62 };
const SEED = { color: 0x6b3a22, emissive: 0x2a140c, emissiveIntensity: 0.04, metalness: 0, roughness: 0.5 };
const LOOK = {
  PaleGreen: SKIN,
  green: SKIN,
  DarkBrown: STEM,
  brown: STEM,
  _defaultMat: STEM,
  DarkGreen: LEAF,
  brownLight: FLESH,
  brownDark: SEED,
};

function materialsOf(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

function smoothShade(root, tolerance = 1e-4) {
  let before = 0, after = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.geometry;
    before += src.attributes.position.count;
    for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) src.deleteAttribute(name);
    const merged = BufferGeometryUtils.mergeVertices(src, tolerance);
    merged.computeVertexNormals();
    src.dispose();
    o.geometry = merged;
    after += merged.attributes.position.count;
    for (const m of materialsOf(o)) {
      m.flatShading = false;
      m.needsUpdate = true;
    }
  });
  return { before, after };
}

function meshByMaterial(root, name) {
  let found = null;
  root.traverse((o) => {
    if (o.isMesh && materialsOf(o).some((m) => m.name === name)) found = o;
  });
  return found;
}

function paintApple(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of materialsOf(o)) {
      const look = LOOK[m.name];
      if (!look) continue;
      m.color.setHex(look.color);
      m.emissive.setHex(look.emissive);
      m.emissiveIntensity = look.emissiveIntensity;
      m.metalness = look.metalness;
      m.roughness = look.roughness;
      const skin = m.name === 'PaleGreen' || m.name === 'green';
      m.envMapIntensity = skin ? 0.22 : 0.12;
      m.side = m.name === 'DarkGreen' ? THREE.DoubleSide : THREE.FrontSide;
      m.flatShading = false;
      if (m.name === 'brownDark') {
        m.polygonOffset = true;
        m.polygonOffsetFactor = -2;
        m.polygonOffsetUnits = -2;
      }
      m.needsUpdate = true;
    }
  });
}

// Лист в модели стоит ребром. Разворачиваем пластинку нормалью к камере,
// вращая вокруг основания — ближайшей к телу вершины.
function faceLeafToCamera(leaf, bodyCenter) {
  const viewDir = new THREE.Vector3(0, 1, 0);
  leaf.updateWorldMatrix(true, false);
  const toWorld = leaf.matrixWorld;
  const attr = leaf.geometry.attributes.position;
  const pts = [];
  for (let i = 0; i < attr.count; i++) {
    pts.push(new THREE.Vector3().fromBufferAttribute(attr, i).applyMatrix4(toWorld));
  }
  const mean = new THREE.Vector3();
  for (const p of pts) mean.add(p);
  mean.multiplyScalar(1 / pts.length);

  const c = new Array(9).fill(0);
  for (const p of pts) {
    const d = p.clone().sub(mean);
    c[0] += d.x * d.x; c[1] += d.x * d.y; c[2] += d.x * d.z;
    c[4] += d.y * d.y; c[5] += d.y * d.z; c[8] += d.z * d.z;
  }
  c[3] = c[1]; c[6] = c[2]; c[7] = c[5];
  const trace = c[0] + c[4] + c[8];
  const m = c.map((x, i) => (i % 4 === 0 ? trace - x : -x));
  const n = new THREE.Vector3(0.41, 0.82, 0.41).normalize();
  for (let i = 0; i < 80; i++) {
    n.set(
      m[0] * n.x + m[1] * n.y + m[2] * n.z,
      m[3] * n.x + m[4] * n.y + m[5] * n.z,
      m[6] * n.x + m[7] * n.y + m[8] * n.z,
    ).normalize();
  }
  if (n.dot(viewDir) < 0) n.negate();

  let base = pts[0], best = Infinity;
  for (const p of pts) {
    const d2 = p.distanceToSquared(bodyCenter);
    if (d2 < best) { best = d2; base = p; }
  }
  const world = new THREE.Matrix4()
    .makeTranslation(base.x, base.y, base.z)
    .multiply(new THREE.Matrix4().makeRotationFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(n, viewDir)))
    .multiply(new THREE.Matrix4().makeTranslation(-base.x, -base.y, -base.z));
  const inv = new THREE.Matrix4().copy(toWorld).invert();
  leaf.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, world).multiply(toWorld));
  leaf.geometry.computeVertexNormals();
}

function centerOf(mesh) {
  return new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
}

let ready = false;
let shadeStats = null;
let bodyMat = null;

function worldNormal(mesh) {
  const attr = mesh.geometry.attributes.normal;
  const n = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  for (let i = 0; i < attr.count; i++) n.add(tmp.fromBufferAttribute(attr, i));
  mesh.updateWorldMatrix(true, false);
  return n.transformDirection(mesh.matrixWorld).normalize();
}

// Половинка Kenney: кожура с одной стороны, плоский срез (мякоть и семечки) с другой.
const gltf = await new GLTFLoader().loadAsync('models/apple_half_green.glb');
const model = gltf.scene;
shadeStats = smoothShade(model);
paintApple(model);

const body = meshByMaterial(model, 'green');
const stem = meshByMaterial(model, 'brown');
const flesh = meshByMaterial(model, 'brownLight');
const leaf = meshByMaterial(model, 'DarkGreen');
bodyMat = materialsOf(body).find((m) => m.name === 'green');

aim.add(model);
spin.updateMatrixWorld(true);

// Срез смотрит в камеру (+Y), черенок — вверх кадра (+Z).
{
  const cutN = worldNormal(flesh);
  const stemDir = centerOf(stem).sub(centerOf(body));
  if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
    const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
    const stemFlat = stemDir.normalize().applyQuaternion(qCut);
    stemFlat.y = 0;
    if (stemFlat.lengthSq() > 1e-8) {
      const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
      model.quaternion.copy(qStem.multiply(qCut));
    } else {
      model.quaternion.copy(qCut);
    }
  }
}
spin.updateMatrixWorld(true);
if (leaf) faceLeafToCamera(leaf, centerOf(body));

// Масштаб: диаметр тела = 1. Центр тела — в начале координат.
{
  const box = new THREE.Box3().setFromObject(body);
  const size = box.getSize(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  const c = box.getCenter(new THREE.Vector3());
  model.scale.setScalar(1 / diam);
  model.position.copy(c).multiplyScalar(-1 / diam);
}
spin.updateMatrixWorld(true);

// Чуть в три четверти: плоскость среза к зрителю, с краю видна кожура.
aim.rotation.x = 0.2;
aim.rotation.z = -0.5;
spin.updateMatrixWorld(true);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();

function updateCamera() {
  const w = innerWidth, h = innerHeight;
  const applePx = APPLE_D * (w / DESIGN_W);
  const worldPerPx = 1 / applePx;
  const visibleW = w * worldPerPx;
  const visibleH = h * worldPerPx;
  const sx = fx * w;
  const sy = fy * h;
  camera.left = -(sx / w) * visibleW;
  camera.right = camera.left + visibleW;
  camera.top = (sy / h) * visibleH;
  camera.bottom = camera.top - visibleH;
  camera.updateProjectionMatrix();
}

function step(dt) {
  if (phase === 'fly') {
    flyT += dt;
    const prev = fy;
    vy += G * dt;
    fy += vy * dt;
    fx += (destFx - fx) * (1 - Math.exp(-5 * dt));
    yaw += yawVel * dt;
    yawVel *= Math.exp(-dt * 0.55);
    if (vy > 0 && prev <= destFy && fy >= destFy) {
      fy = destFy;
      if (Math.abs(vy) < 0.34) {
        vy = 0;
        phase = 'settle';
      } else {
        vy = -vy * e;
        e *= 0.73;
        yawVel += 1.8 + Math.abs(vy) * 1.4;
      }
    }
    if (flyT > 7) {
      fx = destFx;
      fy = destFy;
      vy = 0;
      phase = 'settle';
    }
    const air = Math.min(Math.abs(vy) * 0.45, 0.4);
    spin.scale.setScalar(1 + air * 0.07);
    shadow.scale.setScalar(4.1 * (1 + air * 0.35));
    shadowMat.opacity = 0.48 * (1 - air * 0.28);
  } else if (phase === 'scroll') {
    const target = -scrollY * SPIN_PER_PX;
    yaw += (target - yaw) * (1 - Math.exp(-dt * 8));
    yawVel = 0;
    const a = heroAnchor();
    fx += (a.fx - fx) * (1 - Math.exp(-dt * 10));
    fy += (a.fy - fy) * (1 - Math.exp(-dt * 10));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
  } else if (phase === 'settle') {
    const raw = route === 'hero' ? -scrollY * SPIN_PER_PX : 0;
    const target = route === 'hero' ? raw : nearestTurn(raw, yaw);
    yaw += (target - yaw) * (1 - Math.exp(-dt * 4));
    yawVel = 0;
    fx += (destFx - fx) * (1 - Math.exp(-dt * 8));
    fy += (destFy - fy) * (1 - Math.exp(-dt * 8));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
    if (Math.abs(target - yaw) < 0.02 && Math.abs(destFy - fy) < 0.004) {
      phase = route === 'hero' ? 'scroll' : 'rest';
    }
  } else {
    yaw += (nearestTurn(0, yaw) - yaw) * (1 - Math.exp(-dt * 4));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
  }
  const scrollQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const pitchQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dragPitch);
  const turnQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), dragYaw);
  spin.quaternion.copy(turnQ).multiply(pitchQ).multiply(scrollQ);
}

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();

function overInteractive(event) {
  const t = event.target;
  return t instanceof Element && !!t.closest('a, button, input, textarea, select, summary, label, .scroller');
}

function pointerHitsApple(event) {
  pointerNdc.set((event.clientX / innerWidth) * 2 - 1, -(event.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointerNdc, camera);
  return raycaster.intersectObject(model, true).length > 0;
}

addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || !ready) return;
  if (overInteractive(event)) return;
  if (!pointerHitsApple(event)) return;
  grab = { id: event.pointerId, x: event.clientX, y: event.clientY };
  document.body.style.cursor = 'grabbing';
  event.preventDefault();
});

addEventListener('pointermove', (event) => {
  if (grab && event.pointerId === grab.id) {
    const dx = event.clientX - grab.x;
    const dy = event.clientY - grab.y;
    grab.x = event.clientX;
    grab.y = event.clientY;
    dragYaw += dx * 0.012;
    dragPitch = Math.max(-1.35, Math.min(1.35, dragPitch + dy * 0.012));
    return;
  }
  if (grab) return;
  document.body.style.cursor = !overInteractive(event) && pointerHitsApple(event) ? 'grab' : '';
});

function endGrab(event) {
  if (!grab || event.pointerId !== grab.id) return;
  grab = null;
  document.body.style.cursor = '';
}
addEventListener('pointerup', endGrab);
addEventListener('pointercancel', endGrab);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (ready) step(dt);
  updateCamera();
  renderer.render(scene, camera);
});

ready = true;

const col = bodyMat.color;
globalThis.__apple = {
  THREE,
  scene,
  camera,
  spin,
  shadeStats,
  debug: () => ({
    route,
    phase,
    fx, fy, vy, yaw, yawVel, e,
    dragYaw, dragPitch,
    shade: shadeStats,
    model: 'models/apple_half_green.glb',
    body: col.getStyle(),
    stem: materialsOf(stem).find((m) => m.name === 'brown').color.getStyle(),
    flesh: materialsOf(flesh).find((m) => m.name === 'brownLight').color.getStyle(),
    scrollY,
  }),
